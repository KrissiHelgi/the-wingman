tagline:
  is: Kjúklingavængir á hjólum síðan 2017
  en: Fried chicken wings on wheels since 2017
about:
  - is: The Wingman byrjaði árið 2017 með einfalda hugmynd. Bestu kjúklingavængir landsins eiga ekki að vera fastir á einum stað.
    en: The Wingman started in 2017 with a simple idea. The best chicken wings in the country shouldn’t be stuck in one place.
  - is: Svo við settum djúpsteikingarpottinn í svartan vagn og keyrðum af stað. Í dag mætum við á líkamsræktarstöðvar, hátíðir, vinnustaði og í afmæli um allt höfuðborgarsvæðið.
    en: So we put the fryer in a black van and hit the road. Today you’ll find us at gyms, festivals, workplaces and birthday parties all over the capital area.
  - is: Vængirnir eru marineraðir yfir nótt, steiktir þar til þeir eru stökkir og veltir upp úr sósum sem við gerum sjálf. Engin flýtileið.
    en: Our wings are marinated overnight, fried until properly crispy and tossed in sauces we make ourselves. No shortcuts.
