tagline:
  is: Kjúklingavængir á hjólum síðan 2017
  en: Chicken wings on wheels since 2017
about:
  - is: The Wingman var stofnað af fjórum vinum sem stunduðu nám saman í Háskólanum í Reykjavík. Hugmyndin var að bjóða upp á kjúklingavængi á helstu stórhátíðum sem og skapa ógleymanlega upplifun á einkaviðburðum.
    en: The Wingman was founded by four friends who studied together at the University of Reykjavík. The idea was to serve chicken wings at the biggest festivals — and create an unforgettable experience at private events.
  - is: Hvort sem þú ert að skipuleggja lítinn fjölskylduviðburð eða stóra fyrirtækjahátíð, er The Wingman tilvalinn félagi – eins og nafnið gefur til kynna, alltaf til staðar þegar þú þarft á honum að halda.
    en: Whether you’re planning a small family gathering or a big company celebration, The Wingman is the perfect wingman — always there when you need him, just like the name says.
  - is: Hvort sem það er afmæli, starfsmannagleði, brúðkaup eða hátíð. Við mætum með bílinn og sköpum ógleymanlega upplifun fyrir gesti.
    en: Birthday, staff party, wedding or festival — we show up with the truck and create an unforgettable experience for your guests.
